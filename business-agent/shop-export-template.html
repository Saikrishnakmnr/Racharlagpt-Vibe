<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133e33"><title>My Business Catalog</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f7f7f3;color:#152c24}h1,h2{letter-spacing:-.03em}h1{font-size:clamp(2rem,5vw,4.7rem);margin:12px 0}h2{font-size:1.65rem;margin:0 0 18px}.header{background:linear-gradient(125deg,#0b3a31,#19775f);color:#fff}.head-inner{max-width:1150px;margin:auto;padding:18px 22px 70px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav strong{font-size:1.25rem}.chip{border:1px solid #ffffff66;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px}.hero{max-width:700px;padding-top:70px}.hero p{font-size:1.14rem;color:#deeee8;line-height:1.65}.btn{background:#fff;color:#16543e;padding:12px 18px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}.btn.green{background:#117c5b;color:#fff}.btn.outline{border:1px solid #cdded4;background:transparent;color:#164f39}.container{max-width:1150px;margin:0 auto;padding:32px 22px}.features{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.features span{border:1px solid #ffffff55;border-radius:20px;padding:7px 10px;font-size:12px;color:#d4ede0}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.product{background:white;border:1px solid #e4ebe4;border-radius:20px;overflow:hidden;box-shadow:0 3px 14px #143a2411}.product img,.fallback{width:100%;aspect-ratio:1.4;object-fit:cover}.fallback{display:grid;place-items:center;background:#eff4ee;font-size:55px}.details{padding:18px}.details strong{font-size:17px}.muted{color:#677b70;font-size:13px}.price{font-size:20px;font-weight:900;color:#0a6a4e;margin:12px 0}.details .btn{width:100%}.card{background:white;border:1px solid #dfebe2;border-radius:19px;padding:20px;margin:22px 0}.cart-line{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5ede7;gap:10px;padding:13px 0}.cart-line:last-child{border:0}.cart-line button{border:0;background:#eaf5ec;color:#176443;border-radius:8px;padding:7px 10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;display:block;border-radius:9px;border:1px solid #d9e6dc;padding:11px;font:inherit;margin-top:6px}.field.full{grid-column:1/-1}.sum{font-size:19px;font-weight:900;margin:18px 0}.foot{padding:35px;text-align:center;background:#112f27;color:#c3d7cb;margin-top:25px}.foot p{margin:8px}.alert{color:#a52528;font-size:14px}body[data-model=photography] .header{background:linear-gradient(115deg,#141218,#5e4a35)}body[data-model=photography] .product{border-radius:5px}body[data-model=salon] .header{background:linear-gradient(115deg,#42263b,#9d5479)}body[data-model=restaurant] .header,body[data-model=bakery] .header{background:linear-gradient(115deg,#572d1b,#ba5d31)}body[data-model=wholesale] .header{background:linear-gradient(115deg,#16304f,#3d76ac)}@media(max-width:800px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.products,.fields{grid-template-columns:1fr}.head-inner{padding-bottom:42px}.hero{padding-top:36px}}
</style></head><body><header class="header"><div class="head-inner"><div class="nav"><strong id="businessName">Your Business</strong><span class="chip">Direct WhatsApp orders</span></div><div class="hero"><div class="muted" style="color:#c5e8d9" id="location"></div><h1 id="headline">Welcome</h1><p id="about"></p><button class="btn" id="explore">Explore our catalog ↓</button></div><div id="features" class="features"></div></div></header>
<main class="container"><h2 id="modelHeading">Our selection</h2><div id="items" class="products"></div><div class="card" id="cartBox"><h2 id="orderHeading">Your order</h2><div id="lines"></div><div id="sum" class="sum"></div><div class="fields"><label class="field">Collect / delivery<select id="fulfil"></select></label><label class="field">Payment preference<select id="payment"></select></label><label class="field full" id="addressBox">Delivery address<textarea id="address" rows="2"></textarea></label><label class="field">Your name (optional)<input id="customer" maxlength="90"></label><label class="field">Additional request<input id="note" maxlength="300"></label></div><p><button class="btn green" id="send">Send order enquiry via WhatsApp</button></p><p class="muted">WhatsApp will open a draft. You must tap Send. The seller confirms availability, order totals and payment. We do not process or verify your payment.</p><div id="error" class="alert" role="status"></div></div></main><footer class="foot"><strong id="footName"></strong><p id="footAddress"></p><small>Business storefront created with Racharla Business Agent</small></footer>
<script>window.SHOP_DATA=__SHOP_DATA__;</script>
<script>
(function(){"use strict";const d=window.SHOP_DATA||{};document.body.dataset.model=String(d.model||"general");const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const currency=/^[A-Z]{3}$/.test(d.currency||"INR")?d.currency:"INR";const fmt=v=>{try{return new Intl.NumberFormat("en-IN",{style:"currency",currency}).format(Number(v)||0)}catch{return String(v)+" "+currency}};const labels={photography:"Portfolio & photo packages",salon:"Beauty and wellness services",restaurant:"Our menu",meat:"Fresh cuts & packs",vegetables:"Farm-fresh picks",kirana:"Daily essentials",wholesale:"Bulk catalog & quotations",bakery:"Freshly baked",electronics:"Explore products",general:"Our selection"};const service=["photography","salon","wholesale"].includes(d.model);const products=Array.isArray(d.products)?d.products.filter(p=>p.available!==false):[];const cart={};
$("businessName").textContent=d.name||"Your Business";document.title=(d.name||"My Business")+" | Racharla Business Agent";$("footName").textContent=d.name||"Your Business";$("footAddress").textContent=d.address||"";$("location").textContent=d.address||"";$("headline").textContent=d.tagline||"Welcome to "+(d.name||"our shop");$("about").textContent=d.about||"Browse our products and services.";$("modelHeading").textContent=labels[d.model]||labels.general;$("orderHeading").textContent=service?"Your enquiry":"Your order";
$("features").innerHTML=(d.pickup?["Pickup available"]:[]).concat(d.delivery?["Delivery requests"]:[]).concat(d.appointment?["Bookings & enquiries"]:[]).concat(["Direct WhatsApp contact"]).map(x=>"<span>"+esc(x)+"</span>").join("");
$("explore").onclick=()=>$("items").scrollIntoView({behavior:"smooth"});
const action=service?"Enquire about this":d.model==="meat"?"Select cut":"Add to order";
$("items").innerHTML=products.map(p=>'<article class="product">'+(typeof p.image==="string"&&/^(https:\/\/|data:image\/)/.test(p.image)?'<img alt="" src="'+esc(p.image)+'">':'<div class="fallback">🛍️</div>')+'<div class="details"><strong>'+esc(p.name)+'</strong><p class="muted">'+esc(p.category||"General")+' · '+esc(p.unit||"piece")+'</p><div class="price">'+fmt(p.price)+'</div><button class="btn green" data-add="'+esc(p.id)+'">'+action+'</button></div></article>').join("");
$("items").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;renderCart();$("cartBox").scrollIntoView({behavior:"smooth",block:"nearest"})});
$("fulfil").innerHTML=(d.pickup?'<option value="pickup">Collect from shop</option>':"")+(d.delivery?'<option value="delivery">Delivery request</option>':"")+(d.appointment?'<option value="appointment">Request appointment / quotation</option>':"");
function payment(){const f=$("fulfil").value;let p=[];if(f==="pickup"&&d.cashPickup)p.push(["cash","Cash on pickup"]);if(f==="delivery"&&d.cashDelivery)p.push(["cash","Cash on delivery"]);if(d.directUpi&&currency==="INR")p.push(["upi","Direct UPI (seller confirms)"]);if(f==="appointment")p.push(["confirm","Discuss payment with the business"]);$("payment").innerHTML=p.map(o=>'<option value="'+o[0]+'">'+o[1]+"</option>").join("");$("addressBox").hidden=f!=="delivery";$("send").disabled=!p.length;}
$("fulfil").onchange=payment;payment();
function renderCart(){let rows=products.filter(p=>cart[p.id]>0),sum=rows.reduce((n,p)=>n+Number(p.price||0)*cart[p.id],0);$("lines").innerHTML=rows.map(p=>'<div class="cart-line"><span>'+esc(p.name)+' × '+cart[p.id]+'</span><strong>'+fmt(p.price*cart[p.id])+'</strong><button data-minus="'+esc(p.id)+'">−</button></div>').join("");$("lines").querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{cart[b.dataset.minus]=Math.max(0,cart[b.dataset.minus]-1);renderCart()});$("sum").textContent="Estimated total: "+fmt(sum);}
renderCart();
$("send").onclick=()=>{const phone=String(d.phone||"").replace(/\D/g,"");const rows=products.filter(p=>cart[p.id]>0);if(!/^\d{8,15}$/.test(phone))return $("error").textContent="Seller contact unavailable.";if(!rows.length)return $("error").textContent="Select at least one item.";if(!$("payment").value)return $("error").textContent="Payment option unavailable. Contact the seller.";const delivery=$("fulfil").value==="delivery",address=$("address").value.trim();if(delivery&&!address)return $("error").textContent="Enter a delivery address.";const sum=rows.reduce((n,p)=>n+Number(p.price||0)*cart[p.id],0);const lines=["Hello "+(d.name||"Shop")+", "+(service?"I want to enquire about:":"I would like to order:"),...rows.map((p,i)=>(i+1)+". "+p.name+" × "+cart[p.id]+" "+p.unit+" = "+fmt(p.price*cart[p.id])),"Estimated total: "+fmt(sum),"Fulfilment: "+($("fulfil").value==="appointment"?"Service / quotation enquiry":delivery?"Delivery requested":"Customer pickup"),"Payment preference: "+$("payment").selectedOptions[0].textContent];if(delivery)lines.push("Delivery address: "+address);if($("customer").value.trim())lines.push("Name: "+$("customer").value.trim());if($("note").value.trim())lines.push("Note: "+$("note").value.trim());lines.push("Please confirm availability and the final total.");window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(lines.join("\n")),"_blank","noopener,noreferrer")};
})();
</script></body></html>
